# Font
font_family JetBrains Mono
font_size 11.0

# Glass
background_opacity 0.82
dynamic_background_opacity yes

# Palette tuned for transparent wallpaper
foreground #E6EDF3
background #0D1117

selection_foreground #FFFFFF
selection_background #3A4454

cursor #C5C9D3
cursor_text_color #111318

color0  #161B22
color1  #E06C75
color2  #98C379
color3  #E5C07B
color4  #8AB4F8
color5  #C678DD
color6  #89DDFF
color7  #D8DEE9

color8  #5C6370
color9  #F07178
color10 #AAD94C
color11 #FFB454
color12 #B7CCFF
color13 #C792EA
color14 #89DDFF
color15 #FFFFFF

window_padding_width 10
confirm_os_window_close 0

# Do not force a shell here.
# Kitty will use your login shell (zsh if you changed it with chsh).
