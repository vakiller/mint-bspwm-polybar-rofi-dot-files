; Caelestia-style polybar (Material 3 dark) – translucent floating bar
; Icons: Material Symbols Rounded (~/.local/share/fonts/MaterialSymbolsRounded.ttf)

[colors]
; alpha giữ hiệu ứng trong suốt + blur của picom
surface              = #B3131317
primary              = #C6BFFF
on-surface           = #E5E1E9
on-surface-variant   = #C8C5D0
outline              = #6F6D78
error                = #FFB4AB

[bar/main]
width = 98%
height = 38
offset-x = 1%
offset-y = 8
radius = 10

background = ${colors.surface}
foreground = ${colors.on-surface}

border-size = 0

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1

; 1: chữ  2: icon  3: icon lớn (launcher/power)  4: chấm workspace
font-0 = JetBrains Mono Medium:size=10;3
font-1 = Material Symbols Rounded:size=13;5
font-2 = Material Symbols Rounded:size=15;5
font-3 = JetBrains Mono:size=11;3
; dự phòng cho ký tự lạ trong tiêu đề cửa sổ
font-4 = DejaVu Sans:size=10;3
; 6: logo distro (Symbols Nerd Font)
font-5 = Symbols Nerd Font:size=15;5

modules-left = launcher bspwm
modules-center = xwindow
modules-right = tray network cpu memory pulseaudio date powermenu

wm-restack = bspwm
enable-ipc = true
enable-struts = true

cursor-click = pointer
cursor-scroll = ns-resize

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/launcher]
type = custom/text
format = 
format-font = 3
format-foreground = ${colors.primary}
format-padding = 1
click-left = rofi -show drun

; Workspaces dạng chấm như Caelestia: đang chọn = pill dài, có cửa sổ = chấm đặc, trống = chấm rỗng
[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
reverse-scroll = false

format = <label-state>
label-separator = " "

label-focused = "━━"
label-focused-font = 4
label-focused-foreground = ${colors.primary}

label-occupied = "●"
label-occupied-font = 4
label-occupied-foreground = ${colors.on-surface-variant}

label-urgent = "●"
label-urgent-font = 4
label-urgent-foreground = ${colors.error}

label-empty = "○"
label-empty-font = 4
label-empty-foreground = ${colors.outline}

[module/xwindow]
type = internal/xwindow
format = <label>
format-prefix = "󰣭  "
format-prefix-font = 6
format-prefix-foreground = ${colors.primary}
label = %title:0:55:…%
label-foreground = ${colors.on-surface-variant}
label-empty = Desktop
label-empty-foreground = ${colors.outline}

[module/tray]
type = internal/tray
format-margin = 1
tray-spacing = 8
tray-size = 16

[module/network]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.primary}
label-connected = %downspeed%
label-connected-foreground = ${colors.on-surface-variant}
format-disconnected = <label-disconnected>
format-disconnected-prefix = " "
format-disconnected-prefix-font = 2
format-disconnected-prefix-foreground = ${colors.outline}
label-disconnected = offline
label-disconnected-foreground = ${colors.outline}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = %{A1:~/.config/polybar/scripts/volume.sh menu &:}<ramp-volume> <label-volume>%{A}
label-volume = %percentage%%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-font = 2
ramp-volume-foreground = ${colors.primary}
format-muted = %{A1:~/.config/polybar/scripts/volume.sh menu &:}%{T2}%{F#6F6D78}%{F-}%{T-} <label-muted>%{A}
label-muted = muted
label-muted-foreground = ${colors.outline}
click-middle = ~/.config/polybar/scripts/volume.sh mute
click-right = pavucontrol &

[module/date]
type = internal/date
interval = 1
date = %a %d/%m
time = %H:%M
label = %time%  %{F#C8C5D0}%date%%{F-}
; internal/date không có click-left → bọc cả icon + nhãn bằng action tag
format = %{A1:~/.config/polybar/scripts/calendar.sh &:}%{T2}%{F#C6BFFF}%{F-}%{T-} <label>%{A}

[module/powermenu]
type = custom/text
format = 
format-font = 3
format-foreground = ${colors.error}
format-padding = 1
click-left = ~/.config/polybar/scripts/powermenu.sh &
