# picom v13 (build tại ~/.local/bin/picom) – glass + animation kiểu Caelestia
# Bản cho picom v10 của hệ thống: picom-legacy.conf (bspwmrc tự chọn)

backend = "glx";
vsync = true;
use-damage = true;

# Glass / shadow
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.24;
shadow-offset-x = -6;
shadow-offset-y = -6;

corner-radius = 10;

# Fade chỉ dùng cho cửa sổ không có animation riêng bên dưới
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# Blur
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-frame = true;

detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Các luật bên dưới dùng script { opacity = 1 / 0 } = hiện/ẩn tức thì, vì animations của nhiều luật được gộp chứ không ghi đè

# Animation mặc định cho cửa sổ thường: phóng nhẹ + mờ dần
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.95;
    duration = 0.18;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.95;
    duration = 0.14;
  }
);

rules = (
  # Desktop: không blur, không bóng, không animation
  {
    match = "window_type = 'desktop'";
    blur-background = false;
    shadow = false;
    animations = (
      { triggers = [ "open", "show" ]; opacity = 1; },
      { triggers = [ "close", "hide" ]; opacity = 0; }
    );
  },

  # Polybar: blur giống popup để chỗ nối liền mạch; không bóng, không animation
  {
    match = "window_type = 'dock'";
    shadow = false;
    animations = (
      { triggers = [ "open", "show" ]; opacity = 1; },
      { triggers = [ "close", "hide" ]; opacity = 0; }
    );
  },

  # Popup rofi dưới polybar (lịch / âm lượng / nguồn):
  # góc trên vuông (rofi tự bo góc dưới), không bóng, trượt ra từ mép dưới bar.
  {
    match = "name ^= 'rofi - rofi-popup'";
    corner-radius = 0;
    shadow = false;
    fade = false;
    animations = (
      {
        triggers = [ "open", "show" ];
        preset = "slide-in";
        direction = "up";        # bắt đầu ở phía trên (khuất sau bar) rồi trượt xuống
        duration = 0.22;
      },
      {
        triggers = [ "close", "hide" ];
        preset = "slide-out";
        direction = "up";
        duration = 0.16;
      }
    );
  },

  # Mở lại popup khi chuyển tháng / bấm -/+ âm lượng: hiện tức thì, đóng tức thì
  {
    match = "name = 'rofi - rofi-popup-re'";
    animations = (
      { triggers = [ "open", "show" ]; opacity = 1; },
      { triggers = [ "close", "hide" ]; opacity = 0; }
    );
  },

  # Thông báo dunst: trượt vào từ phải
  {
    match = "class_g = 'Dunst'";
    animations = (
      {
        triggers = [ "open", "show" ];
        preset = "fly-in";
        direction = "left";
        duration = 0.22;
      },
      {
        triggers = [ "close", "hide" ];
        preset = "fly-out";
        direction = "right";
        duration = 0.18;
      }
    );
  }
);
