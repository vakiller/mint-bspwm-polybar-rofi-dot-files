backend = "glx";
vsync = true;

# Glass / shadow
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.24;
shadow-offset-x = -6;
shadow-offset-y = -6;

corner-radius = 10;

# Smooth fade
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# Let apps control their own opacity; Kitty handles its own transparency
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Blur
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-frame = true;

detect-client-opacity = true;
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;

# Avoid visual issues in menus/tooltips
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "name ^= 'rofi - rofi-popup'"
];

# Popup dính liền dưới polybar: góc trên vuông, rofi tự bo góc dưới
rounded-corners-exclude = [
  "name ^= 'rofi - rofi-popup'"
];

# Popup rofi gắn dưới polybar (lịch/âm lượng/nguồn) mở lại mỗi lần bấm nút → tắt fade để không chớp
fade-exclude = [
  "name ^= 'rofi - rofi-popup'"
];
